<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfrotate</title>
<style>
  /* ===== DESIGN.md 토큰 (인라인 hex 금지 — 토큰 참조만 사용) ===== */
  :root {
    --colors-primary: #0066cc;        /* Action Blue — 유일한 액센트 */
    --colors-primary-focus: #0071e3;  /* Focus Blue — 키보드 포커스 링 전용 */
    --colors-canvas-parchment: #f5f5f7;
    --colors-ink: #1d1d1f;            /* 모든 텍스트 — 오류 메시지도 이 톤 유지 */
    --colors-on-primary: #ffffff;
    --rounded-pill: 9999px;
    --spacing-sm: 12px;
    --spacing-lg: 24px;
    --spacing-xxl: 48px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { margin: 0; }

  /* 파치먼트 단일 화면, 중앙 정렬 스택. 본문 17px/400/1.47 + 음수 자간 */
  body {
    background: var(--colors-canvas-parchment);
    color: var(--colors-ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.47;
    letter-spacing: -0.374px;
    min-height: 100vh;
    min-height: 100dvh; /* iOS Safari — 주소창 수축 시 실제 보이는 높이 기준 (구형 브라우저는 위 100vh 사용) */
    display: flex;
    padding: var(--spacing-xxl) var(--spacing-lg);
  }

  main {
    margin: auto;             /* 안전한 수직·수평 중앙 정렬 */
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: var(--spacing-lg);
  }

  /* 헤드라인 — 웨이트 600 + 음수 자간 ("Apple tight") */
  h1 {
    margin: 0;
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.28px;
  }

  p { margin: 0; }

  /* 안내 문구 — 캡션 14px, ink 톤 (제2 색 금지) */
  .notice {
    font-size: 14px;
    line-height: 1.43;
    letter-spacing: -0.224px;
  }

  /* 필 버튼 공통 — 터치 타깃 44px 이상, 그림자 없음 */
  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 44px;
    min-width: 44px;
    padding: 11px 22px;
    border-radius: var(--rounded-pill);
    font: inherit;
    letter-spacing: -0.374px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .pill:active:not(:disabled) { transform: scale(0.95); }  /* 시스템 공통 눌림 상태 */
  .pill:focus-visible {
    outline: 2px solid var(--colors-primary-focus);
    outline-offset: 2px;
  }

  /* 파일 선택·회전 버튼 — 고스트 필 (secondary pill: 투명 배경 + Action Blue 테두리) */
  .file-label,
  .rotate-button {
    background: transparent;
    color: var(--colors-primary);
    border: 1px solid var(--colors-primary);
  }

  /* 파일 선택 전에는 파일 선택이 유일한 주 액션 — Action Blue 채움으로 승격 */
  .file-label.primary {
    background: var(--colors-primary);
    color: var(--colors-on-primary);
    border-color: var(--colors-primary);
  }

  /* 드래그 앤 드롭 안내 — 포인터가 있는 데스크톱 환경에서만 보인다 */
  #drop-hint { display: none; }
  @media (hover: hover) and (pointer: fine) {
    #drop-hint { display: block; }
  }

  /* 회전 버튼 — 아이콘 + 텍스트 필 버튼 */
  #rotate-buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--spacing-sm);
  }
  .rotate-button svg {
    width: 20px;
    height: 20px;
    display: block;
    flex: none;
  }
  #file-input:focus-visible + .file-label {
    outline: 2px solid var(--colors-primary-focus);
    outline-offset: 2px;
  }
  /* 드래그 앤 드롭(데스크톱 보조 경로) 중 드롭 대상 표시 */
  body.dropping .file-label {
    outline: 2px solid var(--colors-primary-focus);
    outline-offset: 2px;
  }

  /* 파일 이름 + 다운로드 아이콘 버튼 한 줄 배치 */
  #name-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: var(--spacing-sm);
    width: 100%;
  }

  /* 다운로드 버튼 — 단 하나의 주 액션, Action Blue 아이콘+텍스트 필 버튼 */
  .download-button {
    background: var(--colors-primary);
    color: var(--colors-on-primary);
    border: none;
    flex: none;
  }
  .download-button svg {
    width: 20px;
    height: 20px;
    display: block;
    flex: none;
  }

  /* 현재 회전 각도 배지 — 조작부 한가운데에서 상태를 보여준다 */
  #angle-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    min-height: 44px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
  }
  .rotate-button:disabled,
  .download-button:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: var(--spacing-sm);
    width: 100%;
  }

  /* 파일 이름 입력 — DESIGN.md search-input 문법 (필 형태, 흰 배경, 헤어라인 테두리) */
  .name-input {
    flex: 0 1 360px;
    min-width: 0;
    max-width: 360px;
    min-height: 44px;
    padding: 12px 20px;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: var(--rounded-pill);
    background: #ffffff;             /* {colors.canvas} */
    color: var(--colors-ink);
    font: inherit;
    letter-spacing: -0.374px;
    text-align: center;
  }
  .name-input:focus-visible {
    outline: 2px solid var(--colors-primary-focus);
    outline-offset: 2px;
  }
  .name-input:disabled { opacity: 0.4; }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    clip-path: inset(50%);
    overflow: hidden;
    white-space: nowrap;
  }

  figure { margin: 0; }
  figcaption {
    margin-top: var(--spacing-sm);
    font-size: 14px;
    line-height: 1.43;
    letter-spacing: -0.224px;
  }

  /* 미리보기 썸네일(최대 10페이지) — 가로 슬라이드 스트립.
     썸네일은 시스템에서 유일하게 그림자가 허용되는 요소 (DESIGN.md) */
  #preview-area { width: 100%; min-width: 0; }
  #preview-strip {
    display: flex;
    align-items: flex-start;
    gap: var(--spacing-lg);
    max-width: 100%;
    overflow-x: auto;
    padding: var(--spacing-lg); /* 그림자가 스크롤 컨테이너에 잘리지 않게 여유를 둔다 */
    scroll-snap-type: x proximity;
  }
  /* 세로폭 고정 — 회전으로 페이지가 가로↔세로로 바뀌어도 영역 높이가 출렁이지 않는다.
     넘치는 가로폭은 스트립의 가로 스크롤이 받아준다. */
  .preview-canvas {
    flex: none;
    scroll-snap-align: center;
    height: 240px;
    width: auto;
    box-shadow: rgba(0, 0, 0, 0.22) 3px 5px 30px;
  }
  /* 내용이 컨테이너보다 좁으면 중앙 정렬, 넘치면 정상 스크롤
     (justify-content: center는 넘칠 때 앞쪽이 잘려 스크롤 불가가 된다) */
  .preview-canvas:first-child { margin-left: auto; }
  .preview-canvas:last-child { margin-right: auto; }

  /* 상태 문구 — ink 톤 유지, 레이아웃 점프 방지 */
  #status { min-height: 25px; }

  /* 반응형 — 폰(≤640px): 헤드라인 34px, 여백 축소 */
  @media (max-width: 640px) {
    body { padding: var(--spacing-lg); }
    h1 { font-size: 34px; }
  }

  /* 좁은 화면(≤480px): 세로 배치 — 아이콘 버튼 줄은 중앙 정렬 유지 */
  @media (max-width: 480px) {
    #controls { flex-direction: column; align-items: stretch; }
    .file-label { width: 100%; }
  }

  /* 작은 폰(≤419px): 헤드라인 28px */
  @media (max-width: 419px) {
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<main>
  <h1>pdfrotate</h1>
  <p>PDF의 모든 페이지를 한 번에 회전해 내려받을 수 있습니다.</p>
  <p class="notice">파일은 서버로 전송되지 않으며, 모든 처리는 브라우저 안에서 이루어집니다.</p>
  <input type="file" id="file-input" class="visually-hidden" accept="application/pdf,.pdf">
  <label for="file-input" id="file-label" class="pill file-label primary">PDF 파일 선택</label>
  <p id="drop-hint" class="notice">파일을 이 창에 끌어다 놓아도 됩니다.</p>
  <p id="file-meta" class="notice" hidden></p>
  <div id="controls" hidden>
    <figure id="preview-area" hidden>
      <div id="preview-strip" role="img" aria-label="미리보기"></div>
      <figcaption id="preview-caption"></figcaption>
    </figure>
    <div id="rotate-buttons">
      <button type="button" class="pill rotate-button" data-delta="270" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        반시계 90°
      </button>
      <span id="angle-badge" aria-label="현재 회전 각도">0°</span>
      <button type="button" class="pill rotate-button" data-delta="90" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        시계 90°
      </button>
    </div>
    <div id="name-row">
      <input type="text" id="name-input" class="name-input" aria-label="저장할 파일 이름"
             placeholder="저장할 파일 이름 (회전하면 자동 설정)" autocomplete="off" spellcheck="false" disabled>
      <button type="button" id="download-button" class="pill download-button" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        다운로드
      </button>
    </div>
  </div>
  <p id="status" role="status"></p>
</main>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
// ===== CORE-START (순수 로직 — Node 검증 스크립트가 이 구간을 추출해 실행한다) =====

// 각도를 정준 표기(0 | 90 | 180 | 270)로 정규화한다.
function normalizeAngle(angle) {
  return ((angle % 360) + 360) % 360;
}

// 상대 회전: 페이지의 기존 회전값에 delta를 가산한 정준 각도를 돌려준다.
function nextRotation(currentAngle, deltaAngle) {
  return normalizeAngle(currentAngle + deltaAngle);
}

// 결과 파일명 규칙: {원본명}-rotated-{각도}.pdf
function resultFileName(originalName, canonicalAngle) {
  const base = originalName.replace(/\.pdf$/i, '');
  return base + '-rotated-' + canonicalAngle + '.pdf';
}

// 문서 내 모든 페이지에 상대 회전 delta(시계 방향 도수)를 적용한 PDF 바이트를 돌려준다.
async function rotateAllPages(pdfBytes, deltaAngle, PDFLib) {
  const doc = await PDFLib.PDFDocument.load(pdfBytes);
  for (const page of doc.getPages()) {
    const current = page.getRotation().angle;
    page.setRotation(PDFLib.degrees(nextRotation(current, deltaAngle)));
  }
  return doc.save();
}

// 파일 열기 검증 — 파싱뿐 아니라 페이지 트리 접근까지 확인하고 페이지 수를 돌려준다.
// (pdf-lib의 관용 파서는 일부 손상 파일을 통과시키고 페이지 접근 시점에야 던진다.)
async function assertOpenablePdf(pdfBytes, PDFLib) {
  const doc = await PDFLib.PDFDocument.load(pdfBytes);
  const pageCount = doc.getPageCount();
  if (pageCount < 1) throw new Error('PDF has no pages');
  return pageCount;
}

// PDF 스펙상 헤더 "%PDF-"는 파일 앞 1024바이트 안에 있어야 한다.
function hasPdfHeader(bytes) {
  if (!bytes) return false;
  const view = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  const marker = [0x25, 0x50, 0x44, 0x46, 0x2d]; // "%PDF-"
  const limit = Math.min(view.length, 1024) - marker.length;
  for (let i = 0; i <= limit; i++) {
    let match = true;
    for (let j = 0; j < marker.length; j++) {
      if (view[i + j] !== marker[j]) { match = false; break; }
    }
    if (match) return true;
  }
  return false;
}

// 파일 열기 실패를 세 부류로 분류한다: 보호 문서 / 비-PDF / 손상된 PDF.
// pdf-lib은 열람 암호가 걸린 문서에 EncryptedPDFError를 던진다.
function classifyOpenFailure(error, bytes) {
  const name = error && error.name;
  const message = error && error.message ? String(error.message) : '';
  if (name === 'EncryptedPDFError' || /encrypted/i.test(message)) return 'protected';
  if (!hasPdfHeader(bytes)) return 'not-pdf';
  return 'corrupt';
}

// 오류 메시지 (한국어 전용, 서버 전송을 암시하는 단어 금지 — CONTEXT.md "파일 선택")
const OPEN_FAILURE_MESSAGES = {
  'protected': '보호 문서(열람 암호가 걸린 PDF)는 지원하지 않습니다. 암호가 없는 PDF 파일을 선택해 주세요.',
  'not-pdf': 'PDF 파일이 아닙니다. PDF 파일을 선택해 주세요.',
  'corrupt': '손상된 PDF라서 열 수 없습니다. 다른 PDF 파일을 선택해 주세요.',
};

// ===== CORE-END =====

function downloadBytes(bytes, fileName) {
  // application/pdf면 모바일 Safari 등이 다운로드 대신 즉석 열기(미리보기)를
  // 하므로, 렌더링 불가 타입으로 지정해 다운로드를 강제한다. 파일명·확장자는
  // download 속성이 보존한다.
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari는 blob URL 내비게이션을 비동기로 시작하므로 즉시 revoke하면
  // 다운로드가 실패할 수 있다(WebKitBlobResource 오류). 지연 후 해제한다.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ===== 미리보기 (최대 첫 10페이지, 가로 슬라이드 — pdfjs-dist, 워커도 같은 고정 버전) =====

const PREVIEW_PAGE_COUNT = 10;
const PREVIEW_CSS_HEIGHT = 240; // 세로폭 고정 — 표시 높이는 CSS(.preview-canvas)와 함께 240px
const previewArea = document.getElementById('preview-area');
const previewStrip = document.getElementById('preview-strip');
const previewCaption = document.getElementById('preview-caption');

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
}

let previewDoc = null;   // pdf.js 문서 — 파일이 바뀔 때만 교체
let previewPages = [];   // 최대 3개 페이지 핸들
let renderSeq = 0;       // 연타로 겹친 렌더링 중 최신 것만 화면에 남긴다

function clearPreview() {
  previewArea.hidden = true;
  previewStrip.replaceChildren();
  previewPages = [];
  if (previewDoc) {
    previewDoc.destroy();
    previewDoc = null;
  }
}

// 파일 선택 시 한 번만 문서를 열고 페이지 핸들을 잡아 둔다 (CONTEXT.md "미리보기").
async function loadPreview(pdfBytes) {
  clearPreview();
  if (!window.pdfjsLib) return; // CDN 로딩 실패 시 미리보기만 생략
  // pdf.js는 전달받은 버퍼를 워커로 이전(detach)하므로 반드시 복사본을 넘긴다.
  previewDoc = await pdfjsLib.getDocument({ data: new Uint8Array(pdfBytes.slice(0)) }).promise;
  const count = Math.min(PREVIEW_PAGE_COUNT, previewDoc.numPages);
  const pages = [];
  for (let i = 1; i <= count; i++) pages.push(await previewDoc.getPage(i));
  previewPages = pages;
  previewCaption.textContent = previewDoc.numPages > count
    ? '미리보기 — 첫 ' + count + '페이지 (총 ' + previewDoc.numPages + '페이지)'
    : '미리보기 — 전체 ' + count + '페이지';
}

// 누적 회전을 반영해 미리보기를 다시 그린다.
// 뷰포트 회전 = 페이지의 기존 회전값(/Rotate) + 누적 회전 — 다운로드 결과와 같은 방향이다.
async function renderPreviews(deltaAngle) {
  if (!previewPages.length) return;
  const seq = ++renderSeq;
  const outputScale = window.devicePixelRatio || 1;
  const canvases = [];
  for (const page of previewPages) {
    const rotation = nextRotation(page.rotate, deltaAngle);
    const base = page.getViewport({ scale: 1, rotation: rotation });
    const viewport = page.getViewport({ scale: PREVIEW_CSS_HEIGHT / base.height, rotation: rotation });
    const canvas = document.createElement('canvas');
    canvas.className = 'preview-canvas';
    // 표시 크기는 CSS(height 240px 고정, width auto)가 정하고,
    // 비트맵은 devicePixelRatio 배율로 선명도를 확보한다.
    canvas.width = Math.floor(viewport.width * outputScale);
    canvas.height = Math.floor(viewport.height * outputScale);
    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: viewport,
      transform: outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null,
    }).promise;
    canvases.push(canvas);
  }
  if (seq !== renderSeq) return; // 그 사이 더 새로운 렌더링이 시작됨 — 이 결과는 버린다
  previewStrip.replaceChildren(...canvases);
  previewArea.hidden = false;
}

const input = document.getElementById('file-input');
const status = document.getElementById('status');
const rotateButtons = Array.from(document.querySelectorAll('.rotate-button'));
const downloadButton = document.getElementById('download-button');
const nameInput = document.getElementById('name-input');
const controls = document.getElementById('controls');
const fileLabel = document.getElementById('file-label');
const fileMeta = document.getElementById('file-meta');
const angleBadge = document.getElementById('angle-badge');

// 누적 회전의 정준 각도별 표시 이름
const DELTA_LABELS = { 0: '회전 없음', 90: '시계 90°', 180: '180°', 270: '반시계 90°' };

// 선택된 파일 (브라우저 메모리에만 존재)
let selectedBytes = null;
let selectedName = '';
let accumulatedDelta = 0;  // 누적 회전 — 정준 표기 0 | 90 | 180 | 270
let fileNameEdited = false; // 사용자가 파일 이름을 직접 수정했으면 자동 갱신을 멈춘다

// 회전 버튼은 파일이 있으면 활성, 다운로드 버튼은 누적 회전이 0이 아닐 때만 활성
// (0이면 내려받을 변화가 없다).
function updateControls() {
  for (const button of rotateButtons) button.disabled = !selectedBytes;
  nameInput.disabled = !selectedBytes;
  downloadButton.disabled = !selectedBytes || accumulatedDelta === 0;
}

function disableControls() {
  for (const button of rotateButtons) button.disabled = true;
  nameInput.disabled = true;
  downloadButton.disabled = true;
}

// 회전 전(누적 회전 0)에는 비워 placeholder를 보이고, 회전하면 기본 이름을 채운다.
// 사용자가 직접 수정한 뒤에는 건드리지 않는다.
function syncNameInput() {
  if (fileNameEdited) return;
  nameInput.value = (selectedBytes && accumulatedDelta !== 0)
    ? resultFileName(selectedName, accumulatedDelta)
    : '';
}

function updateAngleBadge() {
  angleBadge.textContent = accumulatedDelta + '°';
}

nameInput.addEventListener('input', () => { fileNameEdited = true; });

// 파일 선택 전 첫 화면 상태 — 컨트롤은 숨기고 파일 선택을 주 액션으로 승격한다.
function resetToFileSelection() {
  controls.hidden = true;
  fileMeta.hidden = true;
  fileLabel.classList.add('primary');
  fileLabel.textContent = 'PDF 파일 선택';
}

// 파일 선택 공통 경로 — <input> 선택과 드래그 앤 드롭이 함께 사용한다.
async function openFile(file) {
  selectedBytes = null;
  selectedName = '';
  accumulatedDelta = 0;
  fileNameEdited = false;
  resetToFileSelection();
  syncNameInput();
  updateAngleBadge();
  updateControls();
  clearPreview();
  status.textContent = '파일 여는 중…';
  let bytes = null;
  try {
    if (!window.PDFLib) {
      status.textContent = '처리에 필요한 구성 요소를 불러오지 못했습니다. 네트워크 연결을 확인한 뒤 새로고침해 주세요.';
      return;
    }
    bytes = await file.arrayBuffer();
    // 열기 검증 — 비-PDF·손상·보호 문서는 여기서 걸러 파일 선택 상태로 복귀한다 (#4).
    const pageCount = await assertOpenablePdf(bytes, window.PDFLib);
    selectedBytes = bytes;
    selectedName = file.name;
    // 단계적 노출 — 파일이 열린 뒤에야 회전·이름·다운로드가 나타나고,
    // 파일 선택 버튼은 고스트 "다른 파일 선택"으로 물러난다.
    controls.hidden = false;
    fileMeta.textContent = file.name + ' · ' + pageCount + '페이지';
    fileMeta.hidden = false;
    fileLabel.classList.remove('primary');
    fileLabel.textContent = '다른 파일 선택';
    updateControls();
    status.textContent = '회전 버튼으로 방향을 맞춘 뒤 다운로드 버튼을 눌러 주세요.';
    // 미리보기 실패는 회전·다운로드를 막지 않는다 — 버튼 활성화 이후 별도 try로 감싼다.
    try {
      await loadPreview(selectedBytes);
      await renderPreviews(accumulatedDelta);
    } catch (previewError) {
      clearPreview();
    }
  } catch (e) {
    status.textContent = OPEN_FAILURE_MESSAGES[classifyOpenFailure(e, bytes)];
  }
}

input.addEventListener('change', () => {
  const file = input.files && input.files[0];
  input.value = '';
  if (file) openFile(file);
});

// ===== 드래그 앤 드롭 — 데스크톱 보조 경로 (터치 기기에서는 파일 선택 버튼 사용) =====

window.addEventListener('dragover', (e) => {
  e.preventDefault(); // 브라우저 기본 동작(파일을 새 탭으로 여는 것)을 막는다.
  document.body.classList.add('dropping');
});

window.addEventListener('dragleave', (e) => {
  // 창 밖으로 나갈 때만 표시를 걷는다 (자식 요소 간 이동은 무시).
  if (!e.relatedTarget) document.body.classList.remove('dropping');
});

window.addEventListener('drop', (e) => {
  e.preventDefault();
  document.body.classList.remove('dropping');
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) openFile(file); // 단일 파일만 — 첫 파일 외에는 무시 (CONTEXT.md "파일 선택")
});

// 회전 버튼 — 누적 회전을 갱신하고 미리보기를 즉시 다시 그린다. 다운로드는 일어나지 않는다.
for (const button of rotateButtons) {
  button.addEventListener('click', () => {
    if (!selectedBytes) return;
    accumulatedDelta = nextRotation(accumulatedDelta, Number(button.dataset.delta));
    syncNameInput();
    updateAngleBadge();
    updateControls();
    // 0°로 돌아오면 다운로드가 꺼지는 이유를 함께 알려준다.
    status.textContent = accumulatedDelta === 0
      ? '현재 회전: 회전 없음 — 회전 버튼으로 방향을 맞추면 다운로드할 수 있습니다.'
      : '현재 회전: ' + DELTA_LABELS[accumulatedDelta];
    // 렌더링 실패는 조작을 막지 않는다. 연타 시 renderSeq가 최신 결과만 남긴다.
    renderPreviews(accumulatedDelta).catch(() => {});
  });
}

// 다운로드 버튼 — 누적 회전을 문서 전체에 상대 회전으로 적용해 결과 파일을 내려받는다.
downloadButton.addEventListener('click', async () => {
  if (!selectedBytes || accumulatedDelta === 0) return;
  disableControls();
  status.textContent = '회전 중…';
  // 입력 폼의 이름을 우선하되, 비어 있으면 기본 이름으로. .pdf 확장자는 항상 보장한다.
  let fileName = nameInput.value.trim() || resultFileName(selectedName, accumulatedDelta);
  if (!/\.pdf$/i.test(fileName)) fileName += '.pdf';
  try {
    const rotated = await rotateAllPages(selectedBytes, accumulatedDelta, window.PDFLib);
    downloadBytes(rotated, fileName);
    status.textContent = '완료 — 결과 파일이 다운로드되었습니다. 계속 회전하거나 다른 파일을 선택할 수 있습니다.';
  } catch (e) {
    // 선택 시 검증을 통과한 파일이므로 드물지만, 실패 시 같은 분류로 안내한다.
    status.textContent = OPEN_FAILURE_MESSAGES[classifyOpenFailure(e, selectedBytes)];
  } finally {
    updateControls();
  }
});
</script>
</body>
</html>
